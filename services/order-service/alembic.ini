# Order Service - Alembic Configuration

[alembic]

# Migration scripts directory
script_location = %(here)s/alembic

# Python import path
prepend_sys_path = .

# Migration filename format
# Example: revisionid_create_orders_and_order_items.py
# file_template = %%(rev)s_%%(slug)s

# Path separator
path_separator = os

# Database connection
sqlalchemy.url = postgresql+asyncpg://abhi@localhost:5432/orders_db


[post_write_hooks]


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S